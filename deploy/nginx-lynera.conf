## Nginx server block untuk LYNERA (Laravel) di Ubuntu/Debian
## Simpan sebagai: /etc/nginx/sites-available/lynera.my.id
## Aktifkan: sudo ln -s /etc/nginx/sites-available/lynera.my.id /etc/nginx/sites-enabled/
## Uji + reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name lynera.my.id www.lynera.my.id;

    # Root HARUS mengarah ke folder /public milik Laravel
    root /var/www/lynera/public;
    index index.php index.html;

    charset utf-8;

    # Ukuran upload (bukti bayar dsb.)
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM (sesuaikan versi jika bukan 8.2)
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Blokir akses ke file tersembunyi kecuali .well-known (untuk SSL)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache aset statis
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}

## Setelah pasang SSL via certbot (sudo certbot --nginx -d lynera.my.id -d www.lynera.my.id),
## certbot otomatis menambah blok listen 443 + redirect HTTP->HTTPS di file ini.
